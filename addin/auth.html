<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <title>Microsoft oturumu</title>
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  </head>
  <body>
    <p id="status">Microsoft hesabı bekleniyor…</p>
    <script>
      const statusNode = document.getElementById("status");
      const scope = "https://graph.microsoft.com/Mail.Read https://graph.microsoft.com/User.Read";

      Office.onReady(() => {
        void start();
      });

      async function start() {
        const query = new URLSearchParams(window.location.search);
        const returnedError = query.get("error_description") || query.get("error");
        if (returnedError) {
          finish({ error: returnedError });
          return;
        }

        const code = query.get("code");
        if (code) {
          await exchange(code);
          return;
        }

        const clientId = query.get("clientId");
        const tenantId = query.get("tenantId") || "organizations";
        if (!clientId) {
          finish({ error: "Uygulama kimliği eksik." });
          return;
        }

        sessionStorage.setItem("oma.clientId", clientId);
        sessionStorage.setItem("oma.tenantId", tenantId);
        const verifier = randomVerifier();
        sessionStorage.setItem("oma.verifier", verifier);
        const challenge = await sha256Url(verifier);
        const authorize = new URL(`https://login.microsoftonline.com/${tenantId}/oauth2/v2.0/authorize`);
        authorize.searchParams.set("client_id", clientId);
        authorize.searchParams.set("response_type", "code");
        authorize.searchParams.set("redirect_uri", redirectUri());
        authorize.searchParams.set("response_mode", "query");
        authorize.searchParams.set("scope", scope);
        authorize.searchParams.set("code_challenge", challenge);
        authorize.searchParams.set("code_challenge_method", "S256");
        authorize.searchParams.set("prompt", "select_account");
        window.location.assign(authorize.toString());
      }

      async function exchange(code) {
        const clientId = sessionStorage.getItem("oma.clientId");
        const tenantId = sessionStorage.getItem("oma.tenantId") || "organizations";
        const verifier = sessionStorage.getItem("oma.verifier");
        if (!clientId || !verifier) {
          finish({ error: "Oturum doğrulaması yarım kaldı. Yeniden deneyin." });
          return;
        }

        const body = new URLSearchParams({
          client_id: clientId,
          grant_type: "authorization_code",
          code,
          redirect_uri: redirectUri(),
          code_verifier: verifier,
          scope,
        });
        const response = await fetch(`https://login.microsoftonline.com/${tenantId}/oauth2/v2.0/token`, {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body,
        });
        const payload = await response.json();
        if (!response.ok || !payload.access_token) {
          finish({ error: payload.error_description || "Belirteç alınamadı." });
          return;
        }

        sessionStorage.removeItem("oma.verifier");
        finish({ accessToken: payload.access_token, expiresIn: payload.expires_in });
      }

      function finish(payload) {
        if (statusNode) {
          statusNode.textContent = payload.error || "Oturum tamamlandı.";
        }
        Office.context.ui.messageParent(JSON.stringify(payload));
      }

      function redirectUri() {
        return `${window.location.origin}/auth.html`;
      }

      function randomVerifier() {
        const bytes = crypto.getRandomValues(new Uint8Array(32));
        return base64Url(bytes);
      }

      async function sha256Url(value) {
        const digest = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(value));
        return base64Url(new Uint8Array(digest));
      }

      function base64Url(bytes) {
        let text = "";
        for (const byte of bytes) {
          text += String.fromCharCode(byte);
        }
        return btoa(text).replaceAll("+", "-").replaceAll("/", "_").replaceAll("=", "");
      }
    </script>
  </body>
</html>
